name: Fetch trip photos
on:
  push:
    paths: ["**/images.json", "scripts/fetch_images.py", ".github/workflows/fetch-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Download photos (second pass picks up any that were rate-limited)
        run: |
          python scripts/fetch_images.py $(dirname $(ls */images.json))
          sleep 60
          python scripts/fetch_images.py $(dirname $(ls */images.json))
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Mirror trip photos from Wikimedia Commons" && git push)
